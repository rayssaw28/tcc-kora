spring.application.name=conformia-api

# Autenticação JWT
jwt.secret=${JWT_SECRET:troque-este-segredo-de-desenvolvimento-conformia-2026-min-32-bytes}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Banco de dados
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/conformia}
spring.datasource.username=${DB_USER:conformia}
spring.datasource.password=${DB_PASSWORD:conformia}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Acesso local do frontend web
cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}

# Integração do sistema de ponto
integracao.api-key=${INTEGRACAO_API_KEY:}

# Armazenamento e limites de upload
storage.location=${STORAGE_LOCATION:./storage}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
